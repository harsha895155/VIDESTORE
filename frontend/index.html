<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="VideStore – Premium Fashion E-commerce. Discover the latest trends in Men, Women, Streetwear & Accessories." />
  <meta name="keywords" content="fashion, clothing, videstore, premium, streetwear, accessories" />
  <title>VideStore – Premium Fashion Store</title>
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('videstore_theme');
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const defaultTheme = theme ? theme : (supportDarkMode ? 'dark' : 'dark'); // Default to dark for luxury feel
        document.documentElement.setAttribute('data-theme', defaultTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
